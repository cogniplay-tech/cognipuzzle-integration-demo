name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Authenticate to the private registry
        run: echo "//npm.cloudsmith.io/cogniplay/cognipuzzle/:_authToken=${{ secrets.CLOUDSMITH_TOKEN }}" >> .npmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm -r build
